appId: com.zerleg.app
productName: Zerleg Chat
copyright: Zerleg Chat

directories:
  buildResources: resources
  output: release

files:
  - out/**/*
  - package.json

extraResources:
  # Tray icons are loaded at runtime from process.resourcesPath. The @2x
  # variants must ship too, or macOS menu bars render a blurry 1x icon.
  - from: resources
    to: .
    filter:
      - '*.png'

win:
  icon: resources/icon.png
  target:
    - target: nsis
      arch: [x64]

nsis:
  # A stable, space-free filename so the README can link straight to
  # /releases/latest/download/ZerlegChat-Setup.exe and never need updating.
  artifactName: ZerlegChat-Setup.exe
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Zerleg Chat

mac:
  icon: resources/icon.png
  category: public.app-category.productivity
  darkModeSupport: true
  # One universal .dmg rather than four files: nobody should have to know
  # whether their Mac is Intel or Apple Silicon, and the .zip target only
  # exists to feed an auto-updater, which this app does not have.
  artifactName: ZerlegChat.${ext}
  target:
    - target: dmg
      arch: [universal]
  extendInfo:
    # macOS asks before letting an app talk to the local network. Without this
    # string the prompt is unexplained, and if it is denied, peer discovery
    # fails silently - the app looks fine and finds nobody.
    NSLocalNetworkUsageDescription: >-
      Zerleg Chat finds your colleagues on this network and delivers messages
      directly to them. Without this it cannot see anyone.

linux:
  icon: resources/icon.png
  category: Network
  target:
    - AppImage
