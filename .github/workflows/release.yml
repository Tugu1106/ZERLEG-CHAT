name: Release

# Publishing is driven entirely by tags: push v1.2.0 and this builds the
# installers on GitHub's own machines and attaches them to a release. Nothing
# is built or uploaded by hand, so a release can never contain a stale binary.
on:
  push:
    tags: ['v*']
    # Pushing to this branch builds everything but publishes nothing (the
    # publish job is gated on tags), so the pipeline can be exercised without
    # spending a version number or creating a release.
    branches: ['ci-test']
  # Lets you exercise the build from the Actions tab without publishing.
  workflow_dispatch:

permissions:
  contents: write # needed to create the release

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            script: dist
            artifacts: |
              desktop/release/*.exe
              desktop/release/*.blockmap
          - os: macos-latest
            name: macOS
            script: dist:mac
            # macOS has never been verified on real hardware. Let it fail
            # without failing the whole run, so a red workflow keeps meaning
            # "something is actually broken" rather than "macOS again".
            optional: true
            artifacts: |
              desktop/release/*.dmg

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install
        shell: bash
        run: |
          # npm/cli#4828: a package-lock written on one platform omits another
          # platform's optional binaries, so a Windows-generated lock leaves
          # macOS without @rollup/rollup-darwin-arm64 and the build dies in
          # vite. Install fresh on macOS; Windows keeps the locked versions.
          if [ "$RUNNER_OS" = "macOS" ]; then
            rm -f desktop/package-lock.json
          fi
          npm run setup

      # The build output is captured so a failure surfaces as an annotation and
      # an artifact, instead of being buried in a log only a signed-in user can
      # open.
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          if ! npm run ${{ matrix.script }} 2>&1 | tee build.log; then
            # Squash whitespace so the tail fits in a single-line annotation.
            echo "::error::$(tail -c 2500 build.log | tr -s '[:space:]' ' ')"
            exit 1
          fi
        env:
          # No Apple Developer ID, so stop electron-builder hunting for one and
          # failing the macOS job. The build is ad-hoc signed instead.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Keep the build log even when the build fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-build-log
          path: build.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    # Only tags publish. A manual run from the Actions tab therefore builds
    # everything as a smoke test without creating a release.
    # Windows alone is enough to ship; macOS is still unverified, so a failure
    # there must not block the people who actually use it.
    if: always() && !cancelled() && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List what will be attached
        run: ls -la artifacts

      - name: Build release notes from CHANGELOG
        run: node scripts/release-notes.mjs "${GITHUB_REF_NAME}" > RELEASE_NOTES.md

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          # Pulls the matching section out of CHANGELOG.md automatically.
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
